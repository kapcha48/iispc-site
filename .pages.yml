media:
  input: public/archive/source
  output: /archive/source
  categories: [image, document, video]
  extensions: [jpg, jpeg, png, webp, gif, svg, pdf, doc, docx, mp4, webm]

settings:
  content:
    merge: true

content:
  - name: news
    label: Новости
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, status, publishedAt]
      primary: title
      sort: [publishedAt, title]
      search: [title, excerpt, body]
    fields:
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - &status_field
        name: status
        label: Статус
        type: select
        required: true
        default: draft
        options:
          values:
            - { value: draft, label: Черновик }
            - { value: published, label: Опубликовано }
            - { value: archived, label: Архив }
      - { name: excerpt, label: Краткое описание, type: text }
      - { name: cover, label: Обложка, type: image }
      - { name: coverAlt, label: Описание изображения, type: string }
      - { name: publishedAt, label: Дата публикации, type: date, options: { time: true } }
      - { name: sourceUrl, label: Ссылка на источник, type: string }
      - { name: body, label: Текст материала, type: rich-text }

  - name: events
    label: Мероприятия
    type: collection
    path: content/events
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, status, eventDate], primary: title, sort: [eventDate, title], search: [title, excerpt, body, location] }
    fields:
      - { name: title, label: Название, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: excerpt, label: Краткое описание, type: text }
      - { name: cover, label: Обложка, type: image }
      - { name: coverAlt, label: Описание изображения, type: string }
      - { name: eventDate, label: Начало, type: date, options: { time: true } }
      - { name: endDate, label: Окончание, type: date, options: { time: true } }
      - name: format
        label: Формат
        type: select
        options: { values: [{ value: offline, label: Очно }, { value: online, label: Онлайн }, { value: hybrid, label: Смешанный }] }
      - { name: location, label: Место проведения, type: string }
      - { name: registrationUrl, label: Ссылка для регистрации, type: string }
      - { name: body, label: Описание мероприятия, type: rich-text }

  - name: programs
    label: Образовательные программы
    type: collection
    path: content/programs
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, status, programType], primary: title, search: [title, excerpt, body] }
    fields:
      - { name: title, label: Название, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: excerpt, label: Краткое описание, type: text }
      - { name: cover, label: Обложка, type: image }
      - { name: coverAlt, label: Описание изображения, type: string }
      - { name: programType, label: Тип программы, type: string }
      - { name: duration, label: Продолжительность, type: string }
      - { name: document, label: Документ программы, type: file }
      - { name: admission, label: Условия поступления, type: rich-text }
      - { name: body, label: Описание программы, type: rich-text }

  - name: publications
    label: Научные публикации
    type: collection
    path: content/publications
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, status, year], primary: title, sort: [year, title], search: [title, authors, excerpt, body] }
    fields:
      - { name: title, label: Название, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: excerpt, label: Краткое описание, type: text }
      - { name: cover, label: Обложка, type: image }
      - { name: coverAlt, label: Описание изображения, type: string }
      - { name: authors, label: Авторы, type: string }
      - { name: year, label: Год, type: number }
      - { name: file, label: Файл публикации, type: file }
      - { name: externalUrl, label: Внешняя ссылка, type: string }
      - { name: body, label: Аннотация или текст, type: rich-text }

  - name: galleries
    label: Фотогалереи
    type: collection
    path: content/galleries
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, status, eventDate], primary: title, search: [title, excerpt] }
    fields:
      - { name: title, label: Название, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: excerpt, label: Описание, type: text }
      - { name: eventDate, label: Дата, type: date, options: { time: true } }
      - { name: images, label: Фотографии, type: image, list: true }
      - { name: body, label: Дополнительный текст, type: rich-text }

  - name: people
    label: О нас — люди института
    type: collection
    path: content/people
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, role, group, order], primary: title, sort: [order, title], search: [title, role, degree, body] }
    fields:
      - { name: title, label: ФИО, type: string, required: true }
      - { name: slug, label: Адрес, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: role, label: Должность, type: string }
      - { name: degree, label: Учёная степень, type: string }
      - { name: group, label: Группа, type: string }
      - { name: order, label: Порядок, type: number, default: 0 }
      - { name: cover, label: Фотография, type: image }
      - { name: coverAlt, label: Описание фотографии, type: string }
      - { name: excerpt, label: Краткая информация, type: text }
      - { name: body, label: Биография, type: rich-text }

  - name: pages
    label: Страницы сайта
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view: { fields: [title, section, status], primary: title, search: [title, excerpt, body] }
    fields:
      - { name: title, label: Название, type: string, required: true }
      - { name: slug, label: Адрес страницы, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - *status_field
      - { name: section, label: Раздел, type: string }
      - { name: excerpt, label: Краткое описание, type: text }
      - { name: cover, label: Обложка, type: image }
      - { name: coverAlt, label: Описание изображения, type: string }
      - { name: sourceUrl, label: Старый адрес, type: string }
      - { name: body, label: Содержание, type: rich-text }
